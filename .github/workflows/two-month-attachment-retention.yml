name: Two-month attachment retention safety tests
on:
  push:
    branches:
      - safety/two-month-attachment-retention-gated-20261103
  pull_request:
    paths:
      - 'backend/src/services/storageRetentionService.js'
      - 'backend/src/services/fileRetentionBackupReadiness.js'
      - 'backend/scripts/file-retention-backup-gate.mjs'
      - 'backend/src/server.js'
      - 'tests/backend/two-month-attachment-safety-gate.test.mjs'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: |
          node --check backend/src/server.js
          node --check backend/src/services/fileRetentionBackupReadiness.js
          node --check backend/scripts/file-retention-backup-gate.mjs
      - run: |
          node --test tests/backend/storage-retention-policy.test.mjs
          node --test tests/backend/phase14-file-lifecycle-closure.test.mjs
          node --test tests/backend/two-month-attachment-safety-gate.test.mjs
